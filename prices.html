<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hair by Thuli | Prices</title>
    <style>
      :root { --bg: #ffffff; --panel: #fffdf7; --primary: #b88a24; --dark: #7a5a12; --text: #29261f; --muted: #766f60; --line: rgba(122,90,18,.18); }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; line-height: 1.6; }
      .container { width: min(900px, calc(100% - 32px)); margin: auto; }
      header { padding: 24px 0; border-bottom: 1px solid var(--line); }
      .topbar, .price-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .brand-mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: white; background: linear-gradient(135deg, var(--primary), #e6c766); }
      a { color: var(--dark); text-decoration: none; font-weight: 700; }
      main { padding: 70px 0; }
      .eyebrow { display: inline-block; color: var(--dark); background: rgba(184,138,36,.12); padding: 8px 12px; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1, h2 { font-family: Georgia, "Times New Roman", serif; line-height: 1.05; }
      h1 { max-width: 620px; margin: 18px 0 14px; font-size: clamp(2.7rem, 7vw, 5rem); letter-spacing: -.04em; }
      .intro { max-width: 620px; color: var(--muted); margin-bottom: 38px; }
      .price-list { display: grid; gap: 14px; }
      .price-group { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.58); }
      .price-group h2 { margin: 0 0 16px; font-size: 1.8rem; }
      .price-row { padding: 14px 0; border-top: 1px solid var(--line); }
      .price-row:first-of-type { border-top: 0; }
      .price-row span { color: var(--muted); }
      .price-row strong { color: var(--primary); white-space: nowrap; }
      .back { display: inline-flex; margin-top: 30px; padding: 12px 18px; border-radius: 999px; background: var(--primary); color: white; }
      @media (max-width: 520px) { main { padding: 46px 0; } .price-group { padding: 20px; } .price-row { align-items: flex-start; } }
    </style>
  </head>
  <body>
    <header>
      <div class="container topbar">
        <a href="index.html" class="brand"><span class="brand-mark">H</span><span>Hair by Thuli</span></a>
        <a href="index.html#booking">Book now</a>
      </div>
    </header>
    <main>
      <div class="container">
        <span class="eyebrow">Services and prices</span>
        <h1>Choose your next beauty ritual.</h1>
        <p class="intro">Transparent starting prices for our most requested services. Your stylist will confirm the final price during your consultation.</p>
        <div id="publicServiceList" class="price-list"></div>
        <a class="back" href="index.html#booking">Return to booking</a>
      </div>
    </main>
    <script>
      const defaultCategories = [
        { name: 'Hair', services: [{ name: 'Hair Design', price: 'R80', enabled: true }, { name: 'Signature Package', price: 'R320', enabled: true }] },
        { name: 'Skin', services: [{ name: 'Skin Renewal', price: 'R110', enabled: true }] },
        { name: 'Nails', services: [{ name: 'Beauty Rituals', price: 'R65', enabled: true }] }
      ];
      const escapeHtml = (value) => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      function renderPrices(categories) {
        const visibleCategories = categories.map((category) => ({ ...category, services: category.services.filter((service) => service.enabled) })).filter((category) => category.services.length);
        document.getElementById('publicServiceList').innerHTML = visibleCategories.length
          ? visibleCategories.map((category) => `<section class="price-group"><h2>${escapeHtml(category.name)}</h2>${category.services.map((service) => `<div class="price-row"><span>${escapeHtml(service.name)}</span><strong>From ${escapeHtml(service.price)}</strong></div>`).join('')}</section>`).join('')
          : '<section class="price-group"><h2>Services temporarily unavailable</h2><p>Please contact the salon for availability.</p></section>';
      }
      async function loadPrices() {
        let categories = defaultCategories;
        if (window.location.protocol !== 'file:') {
          try {
            const response = await fetch('/api/services');
            if (response.ok) categories = await response.json();
          } catch (error) { /* Static fallback below. */ }
        } else {
          try {
            const saved = JSON.parse(localStorage.getItem('velouraSalonServices') || 'null');
            if (Array.isArray(saved) && saved.every((item) => item.services)) categories = saved;
            else if (Array.isArray(saved)) categories = [{ name: 'Services', services: saved }];
          } catch (error) { /* Default categories below. */ }
        }
        renderPrices(categories);
      }
      loadPrices();
    </script>
  </body>
</html>
